<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Studio 管理</title>
<link rel="stylesheet" href="style.css">
<style>
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);font-weight:700}
main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:16px;padding:16px;max-width:1100px;margin:0 auto}
@media(max-width:800px){main{grid-template-columns:1fr}main>section{display:contents!important}.mvcard{position:sticky;top:0;z-index:20}.mvcard model-viewer{height:38vh;min-height:220px}.listcard{order:10}}
#stage{position:relative;border-radius:10px;overflow:hidden}
model-viewer{width:100%;height:50vh;min-height:300px;display:none;background:transparent}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:34px 16px;text-align:center;color:var(--mut);cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row label{width:90px;flex:none;color:var(--mut);font-size:13px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--ac)}.row output{width:44px;text-align:right;font-size:13px}
.sw{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid var(--bd)}.sw.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
#qr{width:200px;height:200px;max-width:100%;background:#fff;border-radius:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.item button{padding:5px 10px;font-size:13px}
.thumb{width:56px;height:56px;object-fit:contain;border:2px solid var(--bd);border-radius:8px;background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0 0/12px 12px;flex:none;cursor:pointer}.thumb.on{border-color:var(--ac)}
.fxrow{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
</style></head><body>
<header><div>AR Studio 管理</div><button id="out">登出</button></header>
<main>
<section style="display:grid;gap:16px;align-content:start">
 <div class="card mvcard">
  <div id="drop">點擊選擇 .glb 檔案(約 15 MB 內)</div>
  <input type="file" id="file" accept=".glb" hidden>
  <div id="stage"><div class="lay" id="lb"></div><model-viewer id="mv" camera-controls touch-action="pan-y" interaction-prompt="none"></model-viewer><div class="lay" id="lf"></div></div>
  <div class="msg" id="fname"></div>
 </div>
 <div class="card listcard"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>已上載的模型</b><button class="pri" id="nw" style="padding:6px 12px">＋ 上載新模型</button></div><div class="msg" id="tot"></div><div id="list" class="msg">載入中…</div></div>
</section>
<section style="display:grid;gap:16px;align-content:start">
 <div class="card"><b>編輯</b>
  <div class="row"><label>大小</label><input type="range" id="s" min="10" max="300"><output id="so"></output></div>
  <div class="row"><label>旋轉</label><input type="range" id="r" min="0" max="359"><output id="ro"></output></div>
  <div class="row"><label>亮度</label><input type="range" id="e" min="2" max="30"><output id="eo"></output></div>
  <div class="row"><label>陰影</label><input type="range" id="h" min="0" max="20"><output id="ho"></output></div>
  <div class="row"><label>背景</label><div id="bgs" class="row" style="margin:0"></div></div>
  <div class="row"><label>自動旋轉</label><input type="checkbox" id="a"></div>
  <div class="row"><label>AR 固定尺寸</label><input type="checkbox" id="p"></div>
 </div>
 <div class="card"><b>特效圖片</b> <span class="msg">PNG / GIF / WebP</span>
  <div style="margin-top:6px"><button id="fxup">上載圖片</button><input type="file" id="fxfile" accept="image/*" hidden></div>
  <div class="msg">圖片庫(點擊加入模型)</div><div id="lib" class="fxrow" style="flex-wrap:nowrap;overflow-x:auto"></div>
  <div class="msg">模型上的特效(點選後,直接用手指在上方預覽拖動圖片即可移位)</div><div id="sps" class="fxrow"></div>
  <div id="spe" style="display:none">
   <div class="row"><label>大小</label><input type="range" id="fw" min="20" max="500"></div>
   <div class="row"><label>透明度</label><input type="range" id="fo" min="10" max="100"></div>
   <div class="row"><label>旋轉</label><input type="range" id="fr" min="0" max="359"></div>
   <div class="row"><label>類型</label><select id="fm" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"><option value="p">固定在模型上的平面(會跟模型轉)</option><option value="b">面向鏡頭的貼紙</option></select></div>
   <div class="row" id="fyrow"><label>平面朝向</label><input type="range" id="fy" min="0" max="359"></div>
   <div class="row"><label>層次</label><select id="fl" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"><option value="f">在模型前面</option><option value="b">在模型後面</option></select></div>
   <div class="row"><label>動態</label><select id="fa" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"></select></div>
   <button id="fpl">移到畫面中心</button> <button id="fdel">移除</button>
  </div>
  <div class="msg" id="fxm"></div>
 </div>
 <div class="card" style="text-align:center"><b>儲存並生成 QR Code</b><br>
  <button class="pri" id="save" disabled style="margin-top:8px">儲存並生成 QR</button>
  <div class="msg" id="gm"></div>
  <div id="qrw" style="display:none"><canvas id="qr" width="200" height="200"></canvas>
   <div class="msg" id="lk" style="word-break:break-all"></div>
   <button id="dl">下載 QR</button> <button id="cp">複製連結</button> <button id="op">打開客戶頁</button></div>
 </div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="fx.js"></script>
<script>
const $=id=>document.getElementById(id);
const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY), B=CFG.BUCKET;
const pub=k=>`${CFG.SUPABASE_URL}/storage/v1/object/public/${B}/${k}`;
const BGS=['#f4f4f2','#16181d','#dbe7ff','#ffe6d2','#d9f2e3'];
const DEF={s:100,r:0,e:10,h:10,a:0,b:0,p:0};
const newSt=()=>({...DEF,sp:[]});let st=newSt(),cur=null,pending=null,localUrl=null,sizes={};
const fmt=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const mv=$('mv');

sb.auth.getSession().then(({data})=>{if(!data.session)location.replace('index.html');else{loadList();loadLib()}});
$('out').onclick=async()=>{await sb.auth.signOut();location.replace('index.html')};

BGS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=()=>{st.b=i;sync()};$('bgs').appendChild(b)});
['s','r','e','h'].forEach(k=>$(k).oninput=()=>{st[k]=+$(k).value;sync()});
$('a').onchange=()=>{st.a=$('a').checked?1:0;sync()};
$('p').onchange=()=>{st.p=$('p').checked?1:0;sync()};
function setUI(){['s','r','e','h'].forEach(k=>$(k).value=st[k]);$('a').checked=!!st.a;$('p').checked=!!st.p}
function sync(){
  $('so').textContent=st.s+'%';$('ro').textContent=st.r+'°';$('eo').textContent=(st.e/10).toFixed(1);$('ho').textContent=(st.h/10).toFixed(1);
  [...$('bgs').children].forEach((b,i)=>b.classList.toggle('on',i===st.b));
  const sc=st.s/100;
  mv.setAttribute('scale',`${sc} ${sc} ${sc}`);mv.setAttribute('orientation',`0deg ${st.r}deg 0deg`);
  mv.setAttribute('exposure',st.e/10);mv.setAttribute('shadow-intensity',st.h/10);
  $('stage').style.backgroundColor=BGS[st.b];
  st.a?mv.setAttribute('auto-rotate',''):mv.removeAttribute('auto-rotate');
}
sync();

$('drop').onclick=()=>$('file').click();
function newModel(){
  pending=null;cur=null;st=newSt();sel=null;setUI();sync();renderFx();drawSps();
  $('file').value='';mv.style.display='none';mv.removeAttribute('src');mv.src=null;$('drop').style.display='block';
  $('fname').textContent='';$('save').disabled=true;$('qrw').style.display='none';$('gm').textContent='';
}
$('nw').onclick=()=>{newModel();window.scrollTo(0,0)};
$('file').onchange=()=>{
  const f=$('file').files[0];if(!f)return;
  if(!/\.glb$/i.test(f.name)){$('fname').textContent='請選擇 .glb 檔案';return}
  if(f.size>50*1024*1024){$('fname').textContent='檔案太大(上限 50 MB,建議 15 MB 內)';return}
  pending=f;cur=null;st=newSt();setUI();$('file').value='';
  if(localUrl)URL.revokeObjectURL(localUrl);localUrl=URL.createObjectURL(f);
  mv.src=localUrl;sel=null;renderFx();drawSps();mv.style.display='block';$('drop').style.display='none';
  $('fname').textContent=f.name+'('+fmt(f.size)+',未儲存)';$('save').disabled=false;$('qrw').style.display='none';sync();
};

function viewLink(){return new URL('view.html?m='+encodeURIComponent(cur),location.href).href}
function drawQR(){
  const u=viewLink(),q=qrcode(0,'M');q.addData(u);q.make();
  const n=q.getModuleCount(),px=Math.floor(800/(n+8)),c=$('qr');c.width=c.height=px*(n+8);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))g.fillRect((x+4)*px,(y+4)*px,px,px);
  $('lk').textContent=u;$('qrw').style.display='block';
}
$('save').onclick=async()=>{
  const gm=$('gm');gm.className='msg';gm.textContent='儲存中…';$('save').disabled=true;
  try{
    if(pending){
      const safe=pending.name.replace(/\.glb$/i,'').replace(/[^A-Za-z0-9_-]/g,'_').slice(0,40)||'model';
      const key=Math.random().toString(36).slice(2,8)+'-'+safe+'.glb';
      const {error}=await sb.storage.from(B).upload(key,pending,{contentType:'model/gltf-binary'});
      if(error)throw error;cur=key;pending=null;
    }
    const {error:e2}=await sb.storage.from(B).upload(cur+'.json',new Blob([JSON.stringify(st)],{type:'application/json'}),{upsert:true,cacheControl:'0',contentType:'application/json'});
    if(e2)throw e2;
    gm.textContent='已儲存!用手機掃描 QR 即可。想上載另一個,按右上「＋ 上載新模型」。';drawQR();loadList();
  }catch(e){gm.className='msg err';gm.textContent='失敗:'+(e.message||e)}
  $('save').disabled=false;
};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=$('qr').toDataURL('image/png');a.download='ar-qr.png';a.click()};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(viewLink());$('gm').textContent='連結已複製'}catch(e){}};
$('op').onclick=()=>window.open(viewLink(),'_blank');


/* ---- 特效圖片 ---- */
let sel=null;
const ANL={none:'無',flash:'閃爍',float:'上下浮動',pulse:'脈動',spin:'旋轉'};
$('fa').innerHTML=Object.entries(ANL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
FX.init(mv,$('lb'),$('lf'),{edit:true,getScale:()=>st.s/100,onSelect:id=>{sel=id;FX.select(id);drawSps()}});
const fxUrl=s=>pub('fx/'+s.f),cs=()=>st.sp.find(s=>s.id===sel);
function renderFx(){FX.set(st.sp,fxUrl);FX.select(sel)}
function fxMsg(t,e){$('fxm').className='msg'+(e?' err':'');$('fxm').textContent=t}
function drawSps(){
  const box=$('sps');box.innerHTML='';
  st.sp.forEach(s=>{const im=document.createElement('img');im.src=fxUrl(s);im.className='thumb'+(s.id===sel?' on':'');im.onclick=()=>{sel=s.id;FX.select(sel);drawSps()};box.appendChild(im)});
  const s=cs();$('spe').style.display=s?'block':'none';
  if(s){$('fw').value=s.w;$('fo').value=s.o;$('fr').value=s.r;$('fa').value=s.an;$('fl').value=s.l||'f';$('fm').value=s.m||'b';$('fy').value=s.ry||0;$('fyrow').style.display=s.m==='p'?'flex':'none'}
}
[['fw','w'],['fo','o'],['fr','r'],['fy','ry']].forEach(([id,k])=>$(id).oninput=()=>{const s=cs();if(s){s[k]=+$(id).value;FX.touch(s);if(k==='w'||k==='o'||k==='r')FX.touch(s)}});
$('fm').onchange=()=>{const s=cs();if(s){s.m=$('fm').value;$('fyrow').style.display=s.m==='p'?'flex':'none';FX.touch(s)}};
$('fa').onchange=()=>{const s=cs();if(s){s.an=$('fa').value;FX.touch(s)}};
$('fl').onchange=()=>{const s=cs();if(s){s.l=$('fl').value;FX.touch(s);fxMsg(s.l==='b'?'「在模型後面」的圖片,選取編輯時會暫時顯示在前面,取消選取後就會回到後面':'')}};
$('fpl').onclick=()=>{const s=cs();if(!s)return;const t=mv.getCameraTarget(),sc=st.s/100;s.x=+(t.x/sc).toFixed(4);s.y=+(t.y/sc).toFixed(4);s.z=+(t.z/sc).toFixed(4)};
$('fdel').onclick=()=>{st.sp=st.sp.filter(s=>s.id!==sel);sel=null;renderFx();drawSps()};
function addSprite(f){
  if(!mv.src){fxMsg('請先上載或選擇一個模型',1);return}
  const t=mv.getCameraTarget(),sc=st.s/100,id=Math.random().toString(36).slice(2,6);
  st.sp.push({id,f,x:+(t.x/sc).toFixed(4),y:+(t.y/sc).toFixed(4),z:+(t.z/sc).toFixed(4),w:140,o:100,r:0,an:'none',l:'f',m:'p',ry:0});
  sel=id;renderFx();drawSps();fxMsg('已加入(平面)。用手指拖動圖片移位;「平面朝向」可轉動方向,轉動模型時圖片會跟著變形');
}
async function loadLib(){
  const {data}=await sb.storage.from(B).list('fx',{limit:100,sortBy:{column:'created_at',order:'desc'}});
  const L=$('lib');L.innerHTML='';
  (data||[]).filter(f=>f.name&&!f.name.startsWith('.')).forEach(f=>{
    const w=document.createElement('div');w.style.cssText='position:relative;flex:none';
    const im=document.createElement('img');im.src=pub('fx/'+f.name);im.className='thumb';im.title='點擊加入模型';im.onclick=()=>addSprite(f.name);
    const x=document.createElement('button');x.textContent='✕';x.title='刪除這張圖片';
    x.style.cssText='position:absolute;top:-6px;right:-6px;width:22px;height:22px;padding:0;border-radius:50%;font-size:12px;line-height:1';
    x.onclick=async e=>{
      e.stopPropagation();
      if(!confirm('刪除這張圖片?已使用它的模型,特效會消失。'))return;
      const {error}=await sb.storage.from(B).remove(['fx/'+f.name]);
      if(error){fxMsg('刪除失敗:'+error.message,1);return}
      if(st.sp.some(s=>s.f===f.name)){st.sp=st.sp.filter(s=>s.f!==f.name);sel=null;renderFx();drawSps();fxMsg('已刪除。這個模型上用到它的特效已移除,記得按「儲存並生成 QR」')}else fxMsg('已刪除');
      loadLib();
    };
    w.append(im,x);L.appendChild(w);
  });
}
$('fxup').onclick=()=>$('fxfile').click();
$('fxfile').onchange=async()=>{
  const f=$('fxfile').files[0];$('fxfile').value='';if(!f)return;
  if(f.size>3*1048576){fxMsg('圖片太大(建議 1 MB 內,上限 3 MB)',1);return}
  const ext=(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,''),safe=f.name.replace(/\.[^.]+$/,'').replace(/[^A-Za-z0-9_-]/g,'_').slice(0,30)||'fx';
  const key=Math.random().toString(36).slice(2,8)+'-'+safe+'.'+ext;
  fxMsg('上載中…');
  const {error}=await sb.storage.from(B).upload('fx/'+key,f,{contentType:f.type||'image/png'});
  if(error)fxMsg('上載失敗:'+error.message,1);else{fxMsg('已上載,點擊圖片庫的縮圖加入模型');loadLib()}
};

async function loadList(){
  const {data,error}=await sb.storage.from(B).list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});
  const L=$('list');
  if(error){L.className='msg err';L.textContent='讀取失敗:'+error.message;return}
  const rows=(data||[]).filter(f=>f.name.endsWith('.glb'));
  sizes={};let sum=0;rows.forEach(f=>{const z=(f.metadata&&f.metadata.size)||0;sizes[f.name]=z;sum+=z});
  $('tot').textContent=rows.length?`共 ${rows.length} 個模型,合計約 ${fmt(sum)}`:'';
  L.className='';L.innerHTML=rows.length?'':'<div class="msg">未有模型</div>';
  rows.forEach(f=>{
    const d=document.createElement('div');d.className='item';
    const s=document.createElement('span');s.textContent=f.name.replace(/^[a-z0-9]{1,6}-/,'')+(sizes[f.name]?'('+fmt(sizes[f.name])+')':'');
    const be=document.createElement('button');be.textContent='編輯 / QR';be.onclick=()=>edit(f.name);
    const bd=document.createElement('button');bd.textContent='刪除';bd.onclick=()=>del(f.name);
    d.append(s,be,bd);L.appendChild(d);
  });
}
async function edit(key){
  pending=null;cur=key;st=newSt();
  try{const r=await fetch(pub(key+'.json')+'?t='+Date.now());if(r.ok)st={...newSt(),...await r.json()}}catch(e){}
  if(!Array.isArray(st.sp))st.sp=[];sel=null;setUI();mv.src=pub(key);renderFx();drawSps();mv.style.display='block';$('drop').style.display='none';
  $('fname').textContent=key.replace(/^[a-z0-9]{1,6}-/,'')+(sizes[key]?'('+fmt(sizes[key])+')':'');$('save').disabled=false;sync();drawQR();window.scrollTo(0,0);
}
async function del(key){
  if(!confirm('確定刪除?已印出的 QR 會失效。'))return;
  await sb.storage.from(B).remove([key,key+'.json']);
  if(cur===key)newModel();
  loadList();
}
</script></body></html>
